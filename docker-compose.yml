services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend/data:/app/data

  bot:
    build: ./backend
    command: python -m app.bot.main
    env_file: .env
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - api

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
